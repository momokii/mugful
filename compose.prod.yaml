name: mugful-prod

services:
  postgres:
    image: postgres:17.10-bookworm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - internal

  api:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_USER:-momokii}/mugful-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOCAL_AUTH_BYPASS_EMAIL_VERIFICATION: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "0.0.0.0:3001:3001"
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://127.0.0.1:3001/health/live | grep -q ''"status":"live"'' || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mugful-api.rule=Host(`${TRAEFIK_HOST:-mugful.local}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.mugful-api.entrypoints=websecure"
      - "traefik.http.routers.mugful-api.tls.certresolver=myresolver"
      - "traefik.http.services.mugful-api.loadbalancer.server.port=3001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_USER:-momokii}/mugful-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_INTERNAL_ORIGIN: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "0.0.0.0:3002:3000"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://127.0.0.1:3000/api/health/live | grep -q ''"status":"live"'' || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mugful-web.rule=Host(`${TRAEFIK_HOST:-mugful.local}`)"
      - "traefik.http.routers.mugful-web.entrypoints=websecure"
      - "traefik.http.routers.mugful-web.tls.certresolver=myresolver"
      - "traefik.http.services.mugful-web.loadbalancer.server.port=3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mailpit:
    image: axllent/mailpit:v1.28.2
    networks:
      - default
      - internal

volumes:
  postgres-data:
    driver: local

networks:
  internal:
    driver: bridge
  web:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: false
